[package]
name = "rofarm-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RoFarm fleet runtime, headless daemon and CLI"

[lib]
name = "rofarm_runtime"
path = "src/lib.rs"

[[bin]]
name = "rofarmd"
path = "src/bin/rofarmd.rs"

[[bin]]
name = "rofarm"
path = "src/bin/rofarm.rs"

[dependencies]
rofarm-core = { workspace = true }
rofarm-vault = { workspace = true }
rofarm-roblox = { workspace = true }
rofarm-win = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
url = { workspace = true }
