[package]
name = "rofarm-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Opt-in local and remote REST/SSE API for RoFarm"

[dependencies]
rofarm-runtime = { package = "rofarm-daemon", path = "../rofarm-daemon" }
rofarm-core = { workspace = true }
rofarm-roblox = { workspace = true }
rofarm-win = { workspace = true }
axum = { version = "0.8", features = ["tokio", "json", "query"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { workspace = true }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "timeout", "trace", "set-header"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
sha1 = "0.10"
hex = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rcgen = "0.13"
rustls-pemfile = "2"
subtle = "2"
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
