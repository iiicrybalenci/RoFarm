[workspace]
resolver = "2"
members = [
  "crates/rofarm-core",
  "crates/rofarm-vault",
  "crates/rofarm-roblox",
  "crates/rofarm-win",
  "crates/rofarm-automation",
  "crates/rofarm-plugin-host",
  "crates/rofarm-api",
  "crates/rofarm-daemon",
  "crates/rofarm-cli",
  "crates/rofarm-app",
  "fuzz",
]
default-members = [
  "crates/rofarm-core",
  "crates/rofarm-vault",
  "crates/rofarm-roblox",
  "crates/rofarm-win",
  "crates/rofarm-automation",
  "crates/rofarm-plugin-host",
  "crates/rofarm-api",
  "crates/rofarm-daemon",
  "crates/rofarm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
authors = ["RoFarm Contributors"]
repository = "https://github.com/rofarm/rofarm"

[workspace.dependencies]
rofarm-core = { path = "crates/rofarm-core" }
rofarm-vault = { path = "crates/rofarm-vault" }
rofarm-roblox = { path = "crates/rofarm-roblox" }
rofarm-win = { path = "crates/rofarm-win" }
rofarm-automation = { path = "crates/rofarm-automation" }
rofarm-plugin-host = { path = "crates/rofarm-plugin-host" }
rofarm-api = { path = "crates/rofarm-api" }

anyhow = "1.0"
base64 = "0.22"
blake3 = { version = "1.5", features = ["rayon"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
hex = "0.4"
parking_lot = "0.12"
proptest = "1.5"
rand = "0.8"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
tempfile = "3"
glob = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3
incremental = false

[profile.dev]
opt-level = 0
debug = 1

[profile.bench]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

[workspace.metadata.rofarm]
app-id = "io.rofarm.desktop"
